<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Minecraft Server</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html[data-theme="dark"], html:not([data-theme]) {
      --bg: #f5fffe; --card: #ffffff; --accent: #0891b2; --text: #0f172a; --muted: #334155;
      --border: rgba(8,145,178,0.22); --nav-bg: rgba(255,255,255,0.95); --btn-text: #fff;
    }
    html[data-theme="dark"] {
      --bg: #070b12; --card: #0f1621; --accent: #22d3ee; --text: #f8fafc; --muted: #cbd5e1;
      --border: rgba(34,211,238,0.22); --nav-bg: rgba(7,11,18,0.95); --btn-text: #083344;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .bg-glow {
      position: fixed; width: 400px; height: 400px;
      border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
    }
    .g1 { top: -100px; left: -80px; background: radial-gradient(circle, rgba(6,182,212,0.3), transparent 70%); }
    .g2 { bottom: -100px; right: -60px; background: radial-gradient(circle, rgba(88,101,242,0.25), transparent 70%); }
    .card {
      position: relative; z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .card h1 {
      font-size: 1.7rem; font-weight: 700; margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #06b6d4, #0d9488);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .card p.sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.6rem; }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 0.35rem; }
    label .opt { font-weight: 400; color: #64748b; }
    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.15);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    .btn {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      border: none; border-radius: 12px;
      color: #04100a;
      font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 0.4rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6,182,212,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .msg { padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    .msg.error { display: block; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .msg.success { display: block; background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.3); color: #67e8f9; }
    .links { text-align: center; margin-top: 1.4rem; font-size: 0.9rem; color: var(--muted); }
    .links a { color: var(--accent-bright); text-decoration: none; font-weight: 600; }
    .back { display: inline-block; margin-bottom: 1.1rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--accent-bright); }
    .note { font-size: 0.8rem; color: #64748b; margin-top: 0.8rem; text-align: center; }
  
    

  </style>


<script>
    (function(){
      try {
        const ref = new URLSearchParams(location.search).get('ref');
        if (ref) localStorage.setItem('mc_ref', ref);
      } catch {}
    })();

(function(){
  document.documentElement.setAttribute('data-theme', 'dark');
  function sync(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var knob = document.getElementById('themeKnob');
    if (knob) knob.textContent = dark ? '🌙' : '☀️';
  }
  function bind(){
    sync();
    /* theme toggle removed */
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>


<script src="/js/site-brand.js" defer></script>
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>
  <div class="card">
    <a href="/" class="back">← Back to Home</a>
    <h1>Register</h1>
    <p class="sub">Create a new account — first user becomes admin</p>
    <div class="msg" id="msg"></div>
    <form id="regForm">
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="row">
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="password" required placeholder="Min 6 chars" minlength="6" />
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <input type="password" id="confirmPassword" required placeholder="Same password" minlength="6" />
        </div>
      </div>
      <div class="form-group">
        <label>Minecraft Username *</label>
        <input type="text" id="mcUsername" required placeholder="Steve123" maxlength="16" />
      </div>
      <div class="form-group">
        <label>Mobile Number <span class="opt">(optional)</span></label>
        <input type="tel" id="mobile" placeholder="+91 98765 43210" />
      </div>
      <div class="form-group">
        <label>Address <span class="opt">(optional)</span></label>
        <textarea id="address" placeholder="Your address..."></textarea>
      </div>
      <button type="submit" class="btn" id="btn">Create Account</button>
    </form>
    <p class="note">* required fields</p>
    <div class="links">
      Already have an account? <a href="/login.html">Login</a>
    </div>
  </div>
  <script>
    (function(){
      try {
        const ref = new URLSearchParams(location.search).get('ref');
        if (ref) localStorage.setItem('mc_ref', ref);
      } catch {}
    })();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (pass !== confirm) {
        msg.className = 'msg error';
        msg.textContent = 'Password and Confirm Password do not match';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Creating...';
      msg.className = 'msg';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: pass,
            confirmPassword: confirm,
            mcUsername: document.getElementById('mcUsername').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            address: document.getElementById('address').value.trim(),
            ref: localStorage.getItem('mc_ref') || new URLSearchParams(location.search).get('ref') || ''
          })
        });
        const data = await res.json();
        if (data.success) { try { sessionStorage.setItem('just_registered','1'); } catch(e) {} }
        if (data.success) {
          msg.className = 'msg success';
          msg.textContent = data.message;
          setTimeout(() => {
            const next = new URLSearchParams(location.search).get('next');
            if (next && next.startsWith('/')) location.href = next;
            else location.href = data.user.role === 'admin' ? '/admin/' : '/';
          }, 1000);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message;
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Could not connect to server';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>

  <script>
    (function(){
      try {
        const ref = new URLSearchParams(location.search).get('ref');
        if (ref) localStorage.setItem('mc_ref', ref);
      } catch {}
    })();

    (async function(){
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        if (!data.success) return;
        const url = data.settings.favicon || data.settings.logo;
        if (!url) return;
        let link = document.querySelector("link[rel='icon']") || document.createElement('link');
        link.rel = 'icon';
        link.href = url;
        document.head.appendChild(link);
        document.title = (data.settings.siteName || 'Server') + (document.title.includes('Login') ? ' - Login' : document.title.includes('Register') ? ' - Register' : '');
      } catch(e) {}
    })();
  </script>
<script src="/js/promo.js"></script>
</body>
</html>
